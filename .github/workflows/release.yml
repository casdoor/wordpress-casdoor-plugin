name: Release

on:
  push:
    branches:
      - master

jobs:
  # tag and release the next version on GitHub, the tag triggers deploy.yml to build the
  # plugin zip and publish it to WordPress.org
  release:
    if: github.repository == 'casdoor/wordpress-casdoor-plugin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Semantic Release
        run: npx semantic-release@24
        env:
          # a personal access token, so that the tag it pushes triggers deploy.yml
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
